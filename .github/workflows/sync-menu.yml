name: Sync Kopi Kenangan Data to MongoDB Atlas

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

concurrency:
  group: sync-kopi-kenangan
  cancel-in-progress: true

jobs:
  sync-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymongo dnspython

      - name: Run Multi-Source Sync to MongoDB Atlas
        env:
          PYTHONUNBUFFERED: "1"
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb+srv://technologyswamp_db_user:EmmGSARebSpWS0Sw@cluster-utama.eyzthyo.mongodb.net/?retryWrites=true&w=majority&appName=Cluster-Utama' }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE || 'kyuti' }}
        run: |
          python scripts/sync_mongodb.py
          python scripts/harvest_outlet_stocks.py
