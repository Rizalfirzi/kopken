name: Sync Kopi Kenangan Data to MongoDB Atlas

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'
        continue-on-error: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymongo dnspython

      - name: Run Multi-Source Sync to MongoDB Atlas
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb+srv://technologyswamp_db_user:EmmGSARebSpWS0Sw@cluster-utama.eyzthyo.mongodb.net/kyuti?retryWrites=true&w=majority' }}
        run: |
          python scripts/sync_mongodb.py

      - name: Commit and push updated master data snapshots
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/outlets_master.json data/menu_master.json
          git diff --staged --quiet || git commit -m "Auto-sync: update outlets & menu master data [skip ci]"
          git push || echo "Push skipped or not needed"
        continue-on-error: true

